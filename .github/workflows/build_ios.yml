name: Build iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - 'smart_receipt/**'
      - '.github/workflows/build_ios.yml'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (IPA)
    runs-on: macos-latest

    defaults:
      run:
        working-directory: smart_receipt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Print Versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Get Dependencies
        run: flutter pub get

      - name: Build iOS (Release, Unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r -y smart_receipt.ipa Payload
          echo "IPA packaging completed."
          ls -lh smart_receipt.ipa

      - name: Upload IPA to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart_receipt-ios-ipa
          path: smart_receipt/build/ios/iphoneos/smart_receipt.ipa
          retention-days: 14

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: smart_receipt/build/ios/iphoneos/smart_receipt.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
